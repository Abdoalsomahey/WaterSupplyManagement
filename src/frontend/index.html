<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Water Supply Management</title>

		 <!-- Favicon -->
   		<link rel="icon" type="image/png" href="/images/xtra-link-icon.png">
		<!-- Bootstrap 5 CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
		<!-- Bootstrap Icons -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
		<!-- Custom CSS -->
		<link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="navs" style="display: none;">
        <div class="container-fluid">
            <!-- Logo -->
			<a class="navbar-brand" href="/">
				<img src="/images/xtra-link-logo-h.png" alt="Water Supply Logo" style="height: 40px;">
			</a>

            <!-- Mobile toggle button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item" id="dashboard">
                        <a class="nav-link menu-link" href="/dashboard/">
                            <i class="bi bi-house-door me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link menu-link" href="/users/">
                            <i class="bi bi-people me-1"></i>Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link menu-link" href="/customers/">
                            <i class="bi bi-person-badge me-1"></i>Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link menu-link" href="/orders/">
                            <i class="bi bi-cart-check me-1"></i>Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link menu-link" href="/invoices/">
                            <i class="bi bi-receipt me-1"></i>Invoices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link menu-link" href="/complaints/">
                            <i class="bi bi-exclamation-triangle me-1"></i>Complaints
                        </a>
                    </li>
                </ul>
                <!-- Right side - Notifications & User Dropdown -->
                <div class="d-flex align-items-center" id="user-section" style="display: none;">
                    <!-- Notifications Dropdown -->
                    <div class="dropdown me-3" id="notification">
                        <button class="btn btn-outline-light btn-sm position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="notification-dropdown">
                            <i class="bi bi-bell"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notification-count" style="display: none;">
                                0
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end notification-dropdown">
                            <li><h6 class="dropdown-header">Notifications</h6></li>
                            <!-- Notifications will be loaded dynamically here -->
                            <li class="notification-loading-item"><a class="dropdown-item text-muted text-center">Loading notifications...</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-center menu-link" href="/complaints/">View all notifications</a></li>
                        </ul>
                    </div>
                    <!-- User Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                            <img src= "/images/default_user.png" alt="User" class="rounded-circle me-2" width="32" height="32">
                            <span id="user-name">Admin User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item menu-link" href="/logout/"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid">
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="text-center py-5" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="content" class="content-wrapper">
                <!-- Content will be loaded here by SPA router -->
            </div>
        </div>
    </main>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS Modules -->
	<script type="module" src="/js/spa.js"></script>
	<script type="module" src="/js/notifications.js"></script>
</body>
</html>
